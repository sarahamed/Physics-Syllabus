<p class="course"><strong><u>PHYS101  فيزياء عامة (1) :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: -</p>
<p><strong>الأبعاد والوحدات الفيزيائية- المتجهات- استاتيكا وديناميكا الأجسام الصلبة- قوانين حفظ الطاقة والحركة- الجاذبية العامة- المرونة- سريان السوائل- اللزوجة- التوتر السطح- الأنابيب الشعرية- طرق مختلفة لتعيين التوتر السطح للسوائل- معادلة برنولى- معادلة بواسيل- قانون استوك- تعريف الحرارة- التغير الإدبياتيكى- الترمومترات- التمدد الحرارى- التغير الأيزوثرمى- السعة الحرارية- الحرارة النوعية- اسالة الغازات- الرطوبة- انتقال الحرارة بالحمل والتوصيل والاشعاع- الاشعاع وتطبيقاته- القوانين العامة للغازات.</strong></p>
<p><strong>العملى:التجارب المستحدثة+ البندول البسيط- هوك.- والحرارة النوعية........</strong></p>
<p><strong>المراجع:Humphery, H. Serway Loney ,S.</strong></p>

<p class="course"><strong><u>PHYS102  فيزياء عامة (2) :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS101</p>
<p><strong>الشحنة الكهربائية- قانون كولوم- المجال الكهربى- خطوط القوى الكهربية- قانون جاوس- الجهد الكهربائى وفرق الجهد- العلاقة بين الجهد والمجال- المكثفات- السعة- العوازل- التيار الكهربائى والمقاومة الكهربية- توصيل المقاومات- الطاقة والقدرة- قاعدة كيرشوف- قنطرة هويتستون- القنطرة المترية- الجهد الكهربى ومقياس الجهد- المغناطيسية- قانون التربيع العكسى- عزم الازدواج- تأثير مجالين متعامدين- قاعدة لابلاس- شدة المجال المغناطيسى- اجهزة القياس- قوانين الحركة- الحركة الدورانية- الحركة الاهتزازية- الحركة التوافقية البسيطة- طبيعة الموجات- الموجات الصوتية- الموجات الضوئية- قوانين الانعكاس والانكسار- المرايا- العدسات- العين وعيوب الابصار- المنشور- الطيف- التداخل والحيود- نظرية هينجز الموجية.</strong></p>
<p><strong>العملى: التجارب المستحدثة+ تجارب متوافقة مع التخصص: القنطرة المترية- مغناطومتر الانحراف- تحقيق قوانين الانعكاس والانكسار.....................</strong></p>
<p><strong>المراجع: Humphery, H. Serway Loney ,S.</strong></p>
<p><strong>اساسيات البصريات لجينكز وهوايت</strong></p>

<p class="course"><strong><u>PHYS141  ميكانيكا كلاسيكية (1) :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: -</p>
<p><strong>جبر المتجهات (الضرب الثلاثي المقياسي والمتجهي – تفاضل وتكامل المتجهات - المجالات المقياسية والمتجهة – العمليات المتجهة – أنواع المجالات) – القوى والحركة الخطية – الحركة في المستوى (المقذوفات – الحركة الدائرية – الإحداثيات القطبية) – نظرية الشغل والطاقة – أنواع القوى – كمية الحركة الخطية وكمية الحركة الزاوية وإنحفاظهما - الدفع وحركة الصاروخ –التصادم المرن وغير المرن.</strong></p>

<p class="course"><strong><u>PHYS142  ميكانيكا كلاسيكية (2) :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS141</p>
<p><strong>الحركة في مجال قوة مركزية - الطاقة الكامنة للجسم – إنحفاظ الطاقة – معادلة المسار – القطع المخروطية – تطبيقات على قوة الجذب العام وقوانين كبلر- الجسم الجاسىء: العزوم والاتزان – الازدواج – مركز الثقل وحركته ونظرياته – الحركة الدورانية وعزم القصور الذاتي – نظرية المحاور المتوازنة- والمتعادلة – ديناميكا دوران الجسم الجاسىء – تطبيقات على البندول البسيط والمركب الفيزيائي وكيتر و الجيرويكوب – اللي في الأسلاك- مقاومة الحركة ( الاحتكاك الجاف – احتكاك الدوران والتدحرج – احتكاك الموائع –الحركة في وسط مقاوم.</strong></p>

<p class="course"><u><strong>PHYS211  بصريات فيزيائية</strong> <strong>:</strong></u> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS102</p>
<p><strong>الحركة الموجية- تراكب الامواج- محصلة حركتين موجيتين (لهما نفس السعة ونفس التردد ونفس الطور- مختلفتى الطور ولهما نفس السعة والتردد- مختلفتى السعة ولهما نفس التردد والطور- مختلفتى التردد والطور ولهما نفس السعة- مختلفتى السعة والطور ولهما نفس التردد)- تجربة ينج- العلاقة بين سعة واهتزازة الضوء المنعكس والمنكسر عند سطح مستو- التداخل فى الأغشية الرقيقة منتظمة السمك- الانعكاسات المتتالية فى الأغشية الرقيقة- التداخل فى الأغشية الرقيقة متغيرة السمك- حلقات نيوتن- مقاييس التداخل (مرآة لويد- مرآة فرنل المزدوجة- منشور فرنل- مقياس ميكلوسن- مقياس جامن- مقياس فايرى يروت)- حيود فرنل- الحيود عند الحرف المستقيم لحاجز معتم- نظرية فرنل- المناطق نصف الدورية على صدر الموجة المستوية- اللوح ذو المناطق- حيود فرانهوفر من فتحة مستطيلة ضيقة- الحيود من عدة فتحات- محزوز الحيود- شدة تحليل المحزوز- شدة التفريق- الاستقطاب- الامتصاص الانتقائى وإستقطاب الضوء- الاستقطاب بالانعكاس- الاستقطاب بالانكسار- الاستقطاب بالانكسار المزدوج- اتجاه الاهتزازة فى الشعاعين العادى وغير العادى- منشور نيكول- نظرية هينجز فى تقسيم ظاهرة الانكسار المزدوج- قياس الاستقطاب.</strong></p>
<p><strong>العملى: التجارب المستحدثة+ مثل محزوز الحيود – ميكلسون.......................</strong></p>
<p><strong>المراجع :</strong></p>
<p><strong>- Available text books at the library and digital library.</strong></p>
<p><strong>- Soars, John and Liz Soars, Headway: Elementary level Oxford University 1996.</strong></p>

<p class="course"><strong><u>PHYS212  ضوء متقدم :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS211</p>
<p><strong>معادلات ماكسويل- معادلات ماكسويل وخصائص موجات الضوء- معادلة الحركة الموجية- طاقة الموجة ومتجهه بوينتج- الإنعكاس والإنكسار للموجات الكهرومغناطيسية- معادلات فرنل- قانون بروستر- الإستقطاب- الإستقطاب بالإنعكاس- الإستقطاب بالإنكسار- الإنكسار المزدوج وتفسير نظرية هينجز- طرق الإستقطاب الأخرى- الإستقطاب الدائرى والأهليجى للبلورات أحادية المحور- صدر الموجة للشعاع العادى والغير عادى- معادل بابينت- اللوح الربع موجى- ظاهرة فاراداى- ظاهرة كير- التشتت- التشتت العادى ومعادلة كوشى- التشتت الشاذ ومعادلة سليمير- الفاعلية الضوئية.</strong></p>
<p><strong>العملى: التجارب المستحدثة+ حلقات نيوتن – الاستقطاب .........................</strong></p>
<p><strong>المراجع :</strong></p>
<p><strong>- Available text books at the library and digital library.</strong></p>
<p><strong>- Soars, John and Liz Soars, Headway: Elementary level Oxford University 1996.</strong></p>

<p class="course"><strong><u>PHYS213  اهتزازات وموجات :</u></strong> (2س.م)</p>
<p>متطلبات المقرر: PHYS102</p>
<p><strong>الحركة التوافقية البسيطة – الذبذبات الحرة – الحركة التذبذبية تحت تأثير قوى مقاومة – الذبذبات القسرية و ظاهرة الرنين – الصيغة التفاضلية لمعادلة الموجة – سرعة الأمواج في الخيوط و القضبان و الغازات – سرعة مجموعة موجان – الموجات الموقوفة – الإعتبارات الأولية لحيود الأشعة السينية و الإلكترونات من البلورات - الأمواج في أكثر من بعد واحد – الأمواج المائية – الأمواج الراسخة.</strong></p>
<p><strong>العملى : التجارب المستحدثة+ ملد- البندول المركب..............</strong></p>
<p><strong>المراجع: اساسيات الفيزياء الكلاسيكية والمعاصرة (د. رأفت كامل واصف)</strong></p>

<p class="course"><strong><u>PHYS221  فيزياء فلكية وأرصاد جوية :</u></strong> (2س.م)</p>
<p>متطلبات المقرر: PHYS101</p>
<p><strong>الضوء- المسافات للنجوم- الشكل العام لتطور النجوم- خصائص النجوم(اللمعان- الكتلة)- المفاهيم الفوتومترية- انماط الاشعاع- درجات الحرارة- اطياف النجوم- المجرات- الخواص الأساسية للنظام الشمسى- اجواء الكواكب- دراسة تفصيلية للغلاف الجوى لكوكب الأرض.</strong></p>
<p><strong>العملى : التجارب المستحدثة+ تعيين معامل التوصيل الحرارى-</strong></p>
<p><strong>المراجع: آفاق علم الفلك(أ.د.محمد احمد سليمان)</strong></p>
<p><strong>علم الفلك العام (د.مرفت السيد عوض-د. مصطفى كمال محمود)</strong></p>

<p class="course"><strong><u>PHYS222  ديناميكا حرارية :</u> </strong>(2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS101</p>
<p><strong>أساسيات الديناميكا الحرارية- النظرية الحركية البسيطة للغازات- معادلة الحالة للغاز المثالى- معادلة فاندرفال للغاز الحقيقى- درجة بويل للغاز الحقيقى- معادلة أندروز- تغيير الحالة- الشغل- الطاقة الداخلية- الإنثالبى- السعة الحرارية- تفاضل دالة الحالة- معاملى التمدد الحجمى والإنضغاط- القانون الأول للديناميكا الحرارية- تطبيقات على القانون الأول- معادلة الطاقة- القانون الثانى للديناميكا الحرارية- تطبيقات على القانون الثانى- الأنتروبيا- معادلة ماكسويل- المعادلة الثانية للطاقة- عملية جول- طومسون وتأثير جول- كلفن- العمليات العكسية والغير عكسية- الجهد الديناميكى الحرارى- التغير الطورى- القانون الثالث للديناميكا الحرارية- تطبيقات على القانون الثالث- إنتقال الحرارة فى الأجسام الصلبة- الأجسام السوداء وقانون إستيفان- دوال التوزيع- توزيع سرعة الجزئ- دوال توزيع الطاقة- دوال الإحتمال.</strong></p>
<p><strong>عملى</strong>: <strong>التجارب المستحدثة+ المكافىء الميكانيكى الحرارى</strong></p>
<p><strong>المراجع:</strong></p>
<p><strong>- Heat and Thermodynamics , Zemansky&amp;Dittman, McGrew-Hill.</strong></p>
<p><strong>- Physics:Principle with applications d.c Gancoli,U.S.A.</strong></p>

<p><strong>الخواص الكهربية للمواد : حالة إتزان الغاز الإلكتروني في المواد الموصلة في حالة عدم وجود مجال كهربي– انحراف الإلكترون في وجود مجال كهربي-زمن الإسترخاء ومتوسط المسار الحر -التوصيل النوعي في الموصلات-التوصيل الكهربي في حالة الغاز المثالي والغير مثالي –قانون ويدمان فرتز لورنس -أعتماد الحرارة على انتقال الحاملات –التوصيل الكهربي في المعادن النقية والسبائك وأشباه الموصلات النقية والمطعمة- الخواص المغناطسية للمواد: أصل الظواهر المغناطسية-تصنيف المواد المغناطسية-العزوم المغناطسية للإلكترونات-النظرية الكلاسيكية للبارامغناطسية-المواد البارا مغناطسية-منحنى التمغنط -النطاقات المغناطسية-الطاقة المتبادلة-الفيرومغناطسية المتضادة - الخواص الفوق موصلية للمواد :اكتشاف فوق موصلية-المجال المغناطيسى الحرج-تأثير ميزنز-السعة الحرارية - فجوة الطاقة للمواد الفوق موصلية و طرق قياسها -الديناميكا الحرارية للانتقالية في المواد فوق الموصلية -النوع الأول من المواد فوق الموصلية -تأثير النظائر-معادلة لندن - نظرية باردن وكوبر تشفرد - النوع الثاني للمواد فوق الموصلية -التيار الدوامي - الفيض المغناطيسى الكمى- المواد فوق الموصلية عالية الحرارة - ميكانيكية الموصلية الفائقة عالية الحرارة -تطبيقات .</strong></p>
<p><strong>الخواص العازلة للمواد: الاستقطاب وثوابت العزل-أنواع الاستقطاب الكهربي- الفقد العزلي- الانهيار الكهربي للعوازل-مصادر الاستقطاب- المواد القطبية والغير قطبية-الخواص الكهربية للعوازل-ظاهرة بيزو الكهربية.</strong></p>

<p class="course"><strong><u>PHYS171  فيزياء حيوية عامة (1) :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: -</p>
<p><strong>الكهربية خلال الجسم الحيوى، الجهاز العصبى والخلية العصبية، الجهد الكهربى للأعصاب ، رسم القلب، رسم المخ، رسم العين. فيزياء الأشعة السينية التشخيصية: توليد الأشعة السينية و إمتصاصها،التصوير بالأشعة السينية. المصادر المشعة المستخدمة فى الطب النووى، النواح الإحصائيه فى الطب النووى. أجهزة القياس الإشعاعى الأساسية و تطبيقاتها الطبيه: عداد جيجر، أنبوبة التضاعف الضوئى، محلل ارتفاع النبضات، كاميرا أشعة جاما، الجرعات الإشعاعية فى الطب النووى. الوقاية من الإشعاع فى الطب: المصادر الطبيعية والصناعيه للأشعة المؤينه، التأثيرات البيولوجية للأشعة المؤينه، وحدات الوقاية الإشعاعية وحدودها فى الطب النووى تطبيقات الحرارة والبرودة فى الطب: العلاج الحرارى بإستخدام كل من، طريقة التواصل الحرارى، الأشعة تحت الحمراء وموجات الراديو، الموجات الميكرونية والموجات فوق الصوتية، إستخدام درجات الحرارة شديدة الانخفاض فى الطب، حفظ الدم و الأنسجة والجراحه بالتبريد. إستخدام الضوء فى الطب: الخواص العامة للضواء وقياس وحدات الضوء، تطبيقات الضوء المرئى فى الطب، مناظير الالياف الضوئية المرنه، تطبيقات الأشعة فوق البنفسجية وتحت الحمراء فى الطب، التصوير بالأشعة تحت الحمراء، الميكروسكوبات.</strong></p>
<p><strong>العملى:التجارب المستحدثة+ Spectophotometer+.............</strong></p>
<p><strong>المراجع:</strong></p>
<p>"<strong>Fundamentals of Ultrasonographic  Techniques" By:  J.D Wicks  &amp; K.S. Howe.</strong></p>
<p><strong>"Aspects of Biophysics" By:</strong> <strong>William Hughes.</strong></p>

<p class="course"><strong><u>PHYS172  فيزياء حيوية عامة (2) :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS171</p>
<p><strong>الطاقة والشغل والقوة داخل الجسم، حفظ الطاقات داخل الجسم، تبديل الطاقات بالجسم، الشغل والقوه، النظم الأساسية لفقد الطاقات الحرارية بالجسم. فيزياء العين والرؤيا، مقدمات الإحساس بالرؤيا وخواص الإبصار الخاص، عوامل تجميع الصورة بالعين. الشبكية كعضو الحساسية للضواء بالعين، والأنواع العامة لمستقبلات الضوء. عيوب الرؤيا وتصحيحها، العدسات الاصقة وكفائة الرؤيا.الصوت فى الطب، خواص عامة للصوت، إنعكاس موجات الصوت، الستيوسكوب (سماعة الطبيب)، تصوير الجسم بموجات فوق صوتية، تأثيرات دوبلر، فيزياء الأذن والسمع، إختبار السمع، الصمم والوسائل السمعية المساعدة، بيوفيزياء العضلات الهيكلية، المرونة، دراسة تأثير الأحمال على إنقباض العضلات، الشد فى العضلات، ديناميكاالدم. المبدأ الهيدروليكى للسريان وعلاقته بشغل القلب. التدفق القلبى وضغط الدم. ظاهرة لاندكيست. معادلة بوزايل ومعادلة برنولى وعلاقتهما بإرتفاع ضغط الدم. الميكانيكا الحيوية للرئة، الشد السطح وعلقته بالرئة. تأثير المنظفات على عملية التنفس. العلاقة بين سريان الهواء وضغطه والمقاومة أثناء عملية التنفس.</strong></p>

<p><strong>سيل الطاقة في عالم البيولوجي تغيير الطاقة الحره للتفاعلات الكيميائية تحت الظروف الاعيارية, نظام ال أ.ت.ب. وانتقال الخلية, الميتوكوندريا , توليه ال أ.ت.ب في الخلية, التنفس و الفوسفره عن طريق الاكسده، البلاستيدات، البناء الضوئي و الفوسفره الضوئيه, انزيم البناء لل أ.ت.ب. , مبدأ الاسموزية الكيميائيه و الدوائر البروتينية, الشغل الكيميائي للبناء الحيوي, البناء الحيوي ح. د. ن. و البروتينات, تجميع التركيب الخلوي.</strong></p>

<p class="course"><strong><u>PHYS274  ديناميكا حرارية للأنظمة البيولوجية :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS101</p>
<p><strong>القانون الأول للديناميكا الحرارية وتطبيقه على النظم البيولوجية ، الطاقة الداخلية للشغل، القانون الأول، الانثالى، الحالة المثالية، تطبيقات على الجزيئات الكبيرة، السعة الحرارية، بقاء الطاقة، الكائنات الحية . القانون الثانى للديناميكا الحرارية: الانتروبى، الطاقة الحرارية، نظم متماثله حراريا، تحطيم البروتين، القانون الثالث والبيولوجى، التحولات والحياه. الطاقة الحرة لجيبس، الحالة المتزنة، العمليات المتحولة، إنتقال الطور، الجهد الكميائى، السوائل الأيونية، الحالة المثالية للجزيئات الكبيرة، تأثير درجة الحرارة على ثابت الاتزان، الإرتباط الكميائى للجزيئات البيولوجية. تطبيقات على طاقة جيبس الحرة: التمثيل الضوئى، الضغط الأسموزى، إتزان دونان، الإنتقال خلال الأغشية، تفاعل الإنزيمات، المساعدات زوبان البيروتينات وإتزانها وديناميكيتها.</strong></p>
<p><strong>العملى:التجارب المستحدثة</strong></p>
<p><strong>المراجع:</strong></p>
<p><strong>- "Dielectric Behavior of Biological Molecules in Solution" By: Grant, R.J. Sheppard and G.P. South.</strong></p>

<p class="course"><strong><u>PHYS373  أطياف جزيئية وتطبيقاتها الحيوية :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS231</p>
<p><strong>الأنظمة الكيميائية - الذرة - الجزيئات - طيف الأمتصاص في المنطقة فوق البنفسيجية و المنطقة المرئية للطيف - أجهزة الإمتصاص لللأشعة الفوق بنفسجية و المرئية - (مصدر الأشعة - وحدة التحكم في الأطوال الموجية - وحدة وضع العينة - وحدة قياس طاقة الأشعة - وحدة التسجيل) – تطبيقات الإمتصاص في المنطقة فوق البنفسيجية و المنطقة المرئية من الطيف - نوع المركبات التي تمتص الأشعة - الإمتصاص بواسطة المركبات العضوية و غير عضوية - التحليل الوصفي و التحليل الكمي.</strong></p>
<p><strong>التحليل الطيفي لإمتصاص الأشعة تحت الحمراء - نظرية أمتصاص الأشعة تحت الحمراء - أجهزة الإمتصاص للأشعة تحت الحمراء - معالجة العينات - تطبيقات التحليل النوعي لإمتصاص الأشعة تحت الحمراء.</strong></p>
<p><strong>التحليل الطيفي للرنين المغناطيسي – الرنين النووي المغناطيسي – أسس التحليل الطيفي بالرنين النووي المغناطيسي - أجهزة الرنين النووي المغناطيسي ( وحدة تغير شدة المجال المغناطيس – مصدر إنبعاج أشعة الراديو – وحدة الكشف عن إمتصاص الأشعة و وحدة وضع العينة – تحضير العينات) – الإنتقال الكيميائي - إزدواج الحركات المغزلية للأنوية المتجاورة – التعرف علي تركيب الجزيئات بإستخدام الرنين النووي المغناطيسي – التصوير بالرنين المغناطيسي.</strong></p>
<p><strong>العملى:التجارب المستحدثة+</strong></p>
<p><strong>المراجع: "Fundamentals of Optics" By: H.White &amp; F.Jenkins  </strong></p>

<p class="course"><strong><u>PHYS374  مواد حيوية بديلة :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: -</p>
<p><strong>المواد المستعملة فى العناصر البديلة: المعادن، السيراميك، البوليمرات، نبذه عن خواصهم وتركيبهم الكميائى: الخواص الكهربائية للمواد الحيوية البديلة: دراسة الخواص الكهربائية فى المجال الإستاتيكى (العلاقات الالكتروستاتيكية -التأين الجزيئى -المجال المحلى وعلاقة كلاسيوس وموسيتى- نظرية ثابت العزل والوزن الجزيئى). النظرية العامة للإسترخاء. طرق مختلفة لقياس الخواص الكهربية (مثل ثابت العزل- المقاومة بأنواعها وغيرهما) للمواد البديلة. الخواص الميكانيكية للمواد الحيوية البديلة. الخواص الأساسية للمواد المستخدمة، قياس الصلابة، الكسر، الإجهاد، التأكل مع الإجهاد، الخواص العامة للمواد المستخدمة فى المواد البديلة. إستجابة الأنسجة والجسم بعد عملية إستبدال المفاصل والأعضاء، تفاعل المادة البديلة مع العظم، دراسة كيفية تشكيل السطح الفاصل بين العظم الطبيعى ومادة تثبيت العضو البديل، سبب إنهيار تثبيت الجزء البديل. تطبيقات على المعادن كمادة بديلة، تفاعلات الجسم مع المعادن والبوليمرات والسيراميك.</strong></p>
<p><strong>العملى:التجارب المستحدثة+</strong></p>

<p><strong>المراجع:</strong></p>
<p><strong>- "Dielectric Behavior of Biological Molecules in Solution" By: Grant, R.J. Sheppard and G.P. South.</strong></p>

<p class="course"><strong><u>PHYS375 ميكانيكا الكم وتطبيقاتها الحيوية :</u></strong> (2س.م)</p>

<p><strong>دراسة مبدأ عدم التحديد لهايزنبرج دراسة معادلة شرودنجر، حل معادلة شرودنجر فى المسائل ذات البعد الواحد، حل معادلة شرودنجر فى حالة ذرة الهيدروجين، حساب مستويات الطاقة للإلكترونات فى جزىء ثنائى الذرة، حساب مستويات الطاقة الإهتزازيه لجزىء ثنائى الذرة، دراسة مستويات الطاقة الدورانيه لجزىء ثنائى الذرة، دراسة ظاهرة النفق فى ميكانيكا الكم، تطبيق ظاهرة النفق فى المواد.</strong></p>

<p class="course"><strong><u>PHYS376  فيزياء حيوية إشعاعية :</u></strong> (2س.م + 1س.م عملي)</p>

<p><strong>الذرة، النواة ، والنظائر المشعة. وحده الكتله الذرية، الجسيمات الأولية المستخدمة فى العلاج الإشعاعى، النشاط الإشعاعى الطبيعى والسلاسل المشعه، قوانين الإضمحلال، الأشعة الصادرة الكليه. الطرق المختلفة للإضمحلال النووى. الطاقة الممتصه فى الجسم من النظائر المشعه المختلفة. تراكم العنصر المشع الناتج من عنصر أخر مشع ، المولدات قصيرة العمر. إنتاج النظائر المشعه. تعامل الإشعاعات المختلفه مع أنسجة الجسم، العلاقة بين طاقة الجسيمات المشحونة والمدى فى الوسط ، تعامل أشعة جاما مع الوسط، الكشف عن الأشعة المؤينة.</strong></p>

<p class="course"><strong><u>PHYS473  فيزياء حيوية للجهاز العصبى :</u></strong> (2س.م + 1س.م عملي)</p>

<p class="course"><strong><u>PHYS474  تخطيط علاج إشعاعى :</u></strong> (2س.م)</p>
<p>متطلبات المقرر: PHYS376</p>
<p><strong>وحدات قياس الجرعات الإشعاعية، الجرعات الصادره والممتصه. العوامل المؤثره على منحنيات توزيع الجرعات المتساويه فى الأنسجة المكافئه، أنواع الأنسجة المكافئه، الحقول الإشعاعية المربعه والدائريه المكافئه للحقول المستطيله، الجرعه النسبيه المئويه والتشتت الخلفى، نسبة (عامل) الجرعة فى الأنسجة الى ذاتها فى الهواء، نسبة الجرعة فى الأنسجة الى ذاتها فى النسيج المكافىء. تأثير إنحناءات سطح الجسم للمريض على خريطة توزيع الجرعات المتساويه وأسلوب معالجتها عمليا أو حسابها، تأثير عدم تجانس الوسط على خريطة توزيع الجرعات المتساوية. المرشحات الوتديه للطاقات العاليه، الجرعه المتكامله. خريطه المنحنيات المتساوية الجرعات لعديد من الحقول الإشعاعية (الثنائيه والثلاثيه) ، الجمع اليدوى للحقول الإشعاعية. أجهزة توجيه الحقول الإشعاعية، حساب الجرعة العلاجية عند ثبوت بعد المصدر عن سطح الجلد بإستخدام الجرعة النسبيه المئويه. روشتة حساب الجرعات العلاجية للمريض. حساب الجرعة العلاجية مع ثبوت بعد المصدر عن محور الدوران بإستخدام نسبة الجرعة فى الأنسجة الى ذاتها فى الهواء. الربط بين الجرعة الإشعاعية النسبيه المئويه والجرعة النسبيه فى الأنسجة الى الهواء.</strong></p>
<p><strong>العملى:التجارب المستحدثة+</strong></p>

<p class="course"><strong><u>PHYS475  فيزياء حيوية اتصال الخلية :</u></strong> (2س.م + 1س.م عملي)</p>
<p>متطلبات المقرر: PHYS377</p>
<p><strong>نظره عامة علي اشارات الخلية, اشارات الخلية المطوره مبكرا خلال تاريخ الحياه ، الخلايا المتصله يمكن ان تكون متقاربه او متباعده، المراحل الثلاث لاشارات الخليه ، الاستقبال، التحويل، الاستجابه، استقبال الاشارهوبدء الاستجابه، الاشاره الكيميائيه المرتبطه بالبروتين المستقبل تسبب تغير في شكل البروتين. معظم مستقبلات الاشاره تكون من غشاء بلازما البروتينات. ممرات تحويل الاشارة، الممرات تنقل الاشاره من المستقبلات الي مستجيبات الخلية . فسفرة البروتين تعتبر طريقة عامة للتنظيم داخل الخلية و تقنية غالبه التحويل الاشارة.</strong></p>

<p class="course"><strong><u>PHYS478  فيزياء حيوية صحية :</u></strong> (2س.م)</p>

<script>
  const originalTitle = document.title;
  const items = document.querySelectorAll(".item");

  function closeMenus() {
    document.querySelectorAll(".menu.show").forEach(m => {
      m.classList.remove("show");
      m.parentElement.querySelector(".ddBtn").setAttribute("aria-expanded", "false");
    });
  }

  function closeItem(item) {
    closeMenus();
    item.classList.remove("open");
    item.querySelector(".btn").setAttribute("aria-expanded", "false");
    item.querySelector(".panel").hidden = true;
    item.querySelector(".paper").innerHTML = "";
    if (!document.querySelector(".item.open")) document.body.classList.remove("viewing");
  }

  function openItem(item) {
    items.forEach(i => { if (i !== item && i.classList.contains("open")) closeItem(i); });
    const btn = item.querySelector(".btn");
    const paper = item.querySelector(".paper");
    paper.innerHTML = "";
    paper.appendChild(document.getElementById("tpl-" + btn.dataset.doc).content.cloneNode(true));
    paper.dir = btn.dataset.dir;
    paper.lang = btn.dataset.dir === "rtl" ? "ar" : "en";
    item.querySelector(".panel").hidden = false;
    item.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    document.body.classList.add("viewing");
    // bring the pressed button + its preview into view
    setTimeout(() => btn.scrollIntoView({ behavior: "smooth", block: "start" }), 30);
  }

  items.forEach(item => {
    const btn = item.querySelector(".btn");
    btn.addEventListener("click", () => item.classList.contains("open") ? closeItem(item) : openItem(item));
    item.querySelector(".pclose").addEventListener("click", () => {
      closeItem(item);
      btn.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    const dd = item.querySelector(".ddBtn"), menu = item.querySelector(".menu");
    dd.addEventListener("click", e => {
      e.stopPropagation();
      const show = !menu.classList.contains("show");
      closeMenus();
      menu.classList.toggle("show", show);
      dd.setAttribute("aria-expanded", show);
    });
    item.querySelector(".dlWord").addEventListener("click", closeMenus);
    item.querySelector(".printBtn").addEventListener("click", () => { closeMenus(); setTimeout(() => window.print(), 50); });
  });

  document.addEventListener("click", closeMenus);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });

  // File name suggested when saving as PDF = document title
  window.addEventListener("beforeprint", () => {
    const open = document.querySelector(".item.open .btn");
    if (open) document.title = open.dataset.title;
  });
  window.addEventListener("afterprint", () => { document.title = originalTitle; });
</script>
</body>
</html>
