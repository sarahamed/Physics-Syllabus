<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المحتوى العلمي (قسم الفيزياء)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #1b2a3a;
    background: linear-gradient(180deg, #eaf1f8 0%, #f8fafc 100%);
  }
  header {
    background: #fff; border-bottom: 5px solid #c9a227;
    box-shadow: 0 2px 10px rgba(11,79,128,.12); padding: 20px 32px;
  }
  .logos { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .logos img { height: 130px; width: auto; }
  main { flex: 1; text-align: center; padding: 40px 16px; }
  h1 {
    display: inline-block; margin: 0 0 36px; padding-bottom: 12px;
    color: #0b4f80; font-size: 2rem; border-bottom: 3px solid #c9a227;
  }
  .links { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .links a {
    width: 100%; max-width: 480px; padding: 16px 24px; color: #fff; text-decoration: none;
    font-size: 1.1rem; font-weight: 600; border-radius: 10px;
    background: linear-gradient(135deg, #0b4f80, #1a74b8);
    box-shadow: 0 4px 12px rgba(11,79,128,.25); transition: transform .15s, box-shadow .15s;
  }
  .links a:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(11,79,128,.35); }
  footer {
    background: #0b3a5e; color: #cfdceb; padding: 10px 16px;
    font-size: 11px; direction: ltr; text-align: left;
  }
</style>
</head>
<body>
  <header>
    <div class="logos">
      <img src="college_logo.jpeg" alt="كلية البنات - جامعة عين شمس">
      <img src="physics_logo.jpeg" alt="قسم الفيزياء">
    </div>
  </header>
  <main>
    <h1>المحتوى العلمي (قسم الفيزياء)</h1>
    <div class="links">
      <a href="syllabus_arb.pdf" target="_blank">المحتوى العلمي علوم (باللغة العربية)</a>
      <a href="syllabus_eng.pdf" target="_blank">المحتوى العلمي علوم (باللغة الإنجليزية)</a>
    </div>
  </main>
  <footer>created by Sara Hamed</footer>
</body>
</html>
